spring.application.name=resume-ai
spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/resume_ai_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:CHANGE_ME}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload.dir=${UPLOAD_DIR:uploads/resumes}
app.upload.max-file-size=${MAX_UPLOAD_SIZE:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#######################################
# Gemini AI
#######################################

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=${AI_TEMPERATURE:0.2}
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.google-search-retrieval=false
spring.ai.google.genai.chat.options.internal-tool-execution-enabled=false
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key:}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.google.genai.embedding.text.options.auto-truncate=true
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=resume_vector_store
spring.ai.vectorstore.pgvector.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration

app.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.max-resume-characters=${AI_MAX_RESUME_CHARACTERS:30000}
app.ai.max-job-description-characters=${AI_MAX_JOB_DESCRIPTION_CHARACTERS:20000}
app.ai.max-job-match-input-characters=${AI_MAX_JOB_MATCH_INPUT_CHARACTERS:45000}

app.rag.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.rag.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
app.rag.vector-table-name=${RAG_VECTOR_TABLE_NAME:resume_vector_store}
app.rag.chunk-size=${RAG_CHUNK_SIZE:800}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:150}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.60}
app.rag.max-question-length=${RAG_MAX_QUESTION_LENGTH:1000}
app.rag.source-excerpt-length=${RAG_SOURCE_EXCERPT_LENGTH:250}
