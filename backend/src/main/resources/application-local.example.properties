# Local development configuration
# Copy this file to application-local.properties and fill in your actual values
# application-local.properties is gitignored and should NOT be committed

# Database Configuration
spring.datasource.password=YOUR_DB_PASSWORD

# JWT Configuration
app.jwt.secret=YOUR_JWT_SECRET_KEY_HERE_MUST_BE_AT_LEAST_256_BITS_LONG

# Gemini AI Configuration
spring.ai.google.genai.api-key=YOUR_GEMINI_API_KEY_HERE